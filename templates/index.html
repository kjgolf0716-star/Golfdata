<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Junior Golf Tracker</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <a href="/" class="brand"><span class="dot"></span> Junior Golf Tracker</a>
</header>
<main>
  <div class="toolbar">
    <input id="searchInput" class="search-input" type="text" placeholder="선수 이름 검색..." />
    <button class="btn-primary" id="addPlayerBtn">+ 선수 추가</button>
  </div>

  <div id="playerList"></div>
</main>

<div id="playerModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="playerModalTitle">선수 추가</h3>
    <label>이름</label>
    <input id="playerNameInput" type="text" placeholder="예: 김주니어" />
    <label>카테고리 (선택)</label>
    <input id="playerCategoryInput" type="text" placeholder="예: U12, 초급반 등" />
    <label>메모 (선택)</label>
    <textarea id="playerNotesInput" placeholder="특이사항, 목표 등"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelPlayerBtn">취소</button>
      <button class="btn-primary" id="savePlayerBtn">저장</button>
    </div>
  </div>
</div>

<script src="/static/index.js"></script>
</body>
</html>
