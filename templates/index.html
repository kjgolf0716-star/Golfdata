<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Junior Golf Tracker</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <a href="/" class="brand"><span class="dot"></span> Junior Golf Tracker</a>
</header>
<main>
  <div class="toolbar">
    <input id="searchInput" class="search-input" type="text" placeholder="Search player name..." />
    <button class="btn-primary" id="addPlayerBtn">+ Add Player</button>
  </div>

  <div id="playerList"></div>
</main>

<div id="playerModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="playerModalTitle">Add Player</h3>
    <label>Name</label>
    <input id="playerNameInput" type="text" placeholder="e.g. Jane Smith" />
    <label>Category (optional)</label>
    <input id="playerCategoryInput" type="text" placeholder="e.g. U12, Beginner" />
    <label>Notes (optional)</label>
    <textarea id="playerNotesInput" placeholder="Notes, goals, etc."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelPlayerBtn">Cancel</button>
      <button class="btn-primary" id="savePlayerBtn">Save</button>
    </div>
  </div>
</div>

<script src="/static/index.js"></script>
</body>
</html>
