<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Junior Golf Tracker</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest-coach.json" />
<meta name="theme-color" content="#0b3d24" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="D3 Coach" />
</head>
<body>
<header class="topbar">
  <a href="/" class="brand"><img src="/static/logo.png" alt="D3 Golf Center" class="brand-logo" /></a>
  <nav class="topnav">
    <a href="/" class="topnav-link active">Players</a>
    <a href="/attendance" class="topnav-link">Attendance</a>
    <a href="/quests" class="topnav-link">Quests</a>
    <a href="/drills" class="topnav-link">Drills</a>
    <a href="/today" class="topnav-link">Today's Class</a>
  </nav>
</header>
<main>
  <div class="toolbar">
    <input id="searchInput" class="search-input" type="text" placeholder="Search player name..." />
    <select id="classFilterSelect" class="search-input class-filter-select"></select>
    <button class="btn-secondary" id="manageClassesBtn">Manage Classes</button>
    <button class="btn-primary" id="addPlayerBtn">+ Add Player</button>
  </div>

  <div id="hallOfFame"></div>

  <div id="playerList"></div>
</main>

<div id="playerModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="playerModalTitle">Add Player</h3>
    <label>Name</label>
    <input id="playerNameInput" type="text" placeholder="e.g. Jane Smith" />
    <label>Category (optional)</label>
    <input id="playerCategoryInput" type="text" placeholder="e.g. U12, Beginner" />
    <label>Notes (optional)</label>
    <textarea id="playerNotesInput" placeholder="Notes, goals, etc."></textarea>
    <label>Starting Level</label>
    <select id="playerLevelSelect"></select>
    <label>Class (optional)</label>
    <select id="playerClassSelect"></select>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelPlayerBtn">Cancel</button>
      <button class="btn-primary" id="savePlayerBtn">Save</button>
    </div>
  </div>
</div>

<div id="classModal" class="modal-backdrop hidden">
  <div class="modal" style="max-width:460px;">
    <h3>Manage Classes</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-6px;">Create your own classes (e.g. "Monday 4pm", "Beginners") and assign players to them from Add/Edit Player.</p>
    <div class="class-manager-list" id="classManagerList"></div>
    <button class="btn-secondary" id="addClassBtn" style="margin-top:10px;width:100%;">+ Add Class</button>
    <div class="modal-actions">
      <button class="btn-primary" id="closeClassModalBtn">Close</button>
    </div>
  </div>
</div>

<script src="/static/gamify.js"></script>
<script src="/static/index.js"></script>
<script src="/static/pwa-register.js"></script>
</body>
</html>
