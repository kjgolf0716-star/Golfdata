<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Golf Journey · D3 Golf Center</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest-junior.json" />
<meta name="theme-color" content="#0b3d24" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My Golf Journey" />
</head>
<body class="public-body">
<div class="public-wrap">
  <div class="public-brand">
    <img src="/static/logo.png" alt="D3 Golf Center" />
  </div>

  <div id="autoLoginLoading" class="public-card public-login-card hidden">
    <div class="public-loading">Logging you in...</div>
  </div>

  <div class="public-card public-login-card">
    <div class="public-login-title">🏌️ Enter Your Code</div>
    <p class="public-login-sub">Ask your coach for your personal code to see your level, quests, and achievements.</p>
    <form id="codeForm" autocomplete="off">
      <input type="text" id="codeInput" class="public-code-input" placeholder="Alex_Li" maxlength="40" autocapitalize="words" />
      <button type="submit" class="btn btn-primary public-login-btn">Go &rarr;</button>
    </form>
    <div id="codeError" class="public-login-error hidden">That code wasn't found. Double-check with your coach.</div>
    <p class="public-login-remember">We'll remember your code on this device so you won't need to type it again.</p>
  </div>
</div>

<script src="/static/my_login.js"></script>
<script src="/static/pwa-register.js"></script>
</body>
</html>
