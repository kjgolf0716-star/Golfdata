<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Player Log · Junior Golf Tracker</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="topbar">
  <a href="/" class="brand"><img src="/static/logo.png" alt="D3 Golf Center" class="brand-logo" /></a>
  <nav class="topnav">
    <a href="/" class="topnav-link">Players</a>
    <a href="/attendance" class="topnav-link">Attendance</a>
    <a href="/quests" class="topnav-link">Quests</a>
    <a href="/drills" class="topnav-link">Drills</a>
    <a href="/today" class="topnav-link">Today's Class</a>
  </nav>
</header>
<main>
  <a href="/" class="back-link">&larr; Back to players</a>
  <div class="player-header">
    <div>
      <h1 id="playerName">-</h1>
      <div class="sub" id="playerMeta"></div>
    </div>
    <div class="header-actions">
      <a class="btn btn-secondary" id="publicProfileLink" href="#" target="_blank" rel="noopener">🎮 View Junior Profile</a>
      <button class="btn-secondary" id="editPlayerBtn">Edit Player</button>
      <button class="btn-primary" id="addDateBtn">+ Add Date</button>
    </div>
  </div>

  <div class="access-code-bar">
    Junior login: <strong id="myLoginUrl">-</strong> &middot; their code is
    <button class="access-code-chip" id="accessCodeChip" title="Click to copy">------</button>
    <button class="access-code-regen" id="regenerateCodeBtn" title="Generate a new code">&#x21bb; New code</button>
    <span id="accessCodeCopied" class="access-code-copied hidden">Copied!</span>
  </div>

  <div id="gamifyPanel" class="gamify-panel"></div>

  <div class="table-wrap">
    <table class="log-table" id="logTable">
      <thead>
        <tr id="tableHeadRow">
          <th class="date-col">Date</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot id="tableFoot"></tfoot>
    </table>
  </div>
  <p id="emptyHint" class="empty-state hidden">No records yet. Use the 'Add Date' button to log the first training session.</p>
</main>

<div id="dateModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3>Add Date</h3>
    <label>Date</label>
    <input id="newDateInput" type="date" />
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelDateBtn">Cancel</button>
      <button class="btn-primary" id="confirmDateBtn">Add</button>
    </div>
  </div>
</div>

<div id="editPlayerModal" class="modal-backdrop hidden">
  <div class="modal">
    <h3>Edit Player</h3>
    <label>Name</label>
    <input id="editNameInput" type="text" />
    <label>Category</label>
    <input id="editCategoryInput" type="text" />
    <label>Notes</label>
    <textarea id="editNotesInput"></textarea>
    <label>Level</label>
    <select id="editLevelSelect"></select>
    <label>Class</label>
    <select id="editClassSelect"></select>
    <div class="modal-actions">
      <button class="btn-danger" id="deletePlayerBtn">Delete Player</button>
      <button class="btn-secondary" id="cancelEditPlayerBtn">Cancel</button>
      <button class="btn-primary" id="saveEditPlayerBtn">Save</button>
    </div>
  </div>
</div>

<div class="save-flash" id="saveFlash">Saved</div>

<script src="/static/gamify.js"></script>
<script src="/static/player.js"></script>
</body>
</html>
